<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1558b0;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>CF Tester</h1>
  <button id="scrapeBtn">Scrape &amp; Send to Local Server</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
